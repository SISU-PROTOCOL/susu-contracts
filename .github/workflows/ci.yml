name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  contracts:
    name: Format, Lint, Test, Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.96.0"
          targets: wasm32v1-none
          components: rustfmt, clippy

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Format check
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

      - name: Build contracts (wasm32v1-none)
        # Equivalent to `stellar contract build`, which wraps this cargo invocation.
        # Builds into ./target so the deployment integration test can find the Wasm
        # by its crate-relative path.
        run: ./scripts/build-contracts.sh

      - name: Verify wasm artifacts exist
        run: |
          set -euo pipefail
          ls -la target/wasm32v1-none/release/*.wasm

      - name: Integration test (Factory deploys a real Group)
        # Gated behind `wasm-integration` because it loads the compiled Wasm. Run
        # here, after the build, so it is actually enforced in CI rather than
        # silently skipped.
        run: cargo test -p susu-factory --features wasm-integration

  security:
    name: Security Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # Full history so the secret scan can see secrets that were committed
          # and later removed.
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.96.0"
          targets: wasm32v1-none

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-audit-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-audit-

      - name: Install cargo-audit and cargo-deny
        # The cargo cache below restores ~/.cargo/bin, where a previous run may
        # already have installed these. `cargo install` refuses to overwrite an
        # existing binary, so install only what is missing.
        run: |
          set -euo pipefail
          command -v cargo-audit >/dev/null 2>&1 || cargo install cargo-audit --locked
          command -v cargo-deny  >/dev/null 2>&1 || cargo install cargo-deny  --locked

      - name: cargo audit
        run: cargo audit

      - name: cargo deny
        run: cargo deny check

      - name: Secret scan (gitleaks)
        run: |
          set -euo pipefail
          GITLEAKS_VERSION=8.30.1
          curl -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks git . --redact --no-banner --exit-code 1
