# cargo-deny configuration.
# Run: cargo deny check

[graph]
# Only the target that is actually deployed is checked.
#
# A Soroban contract runs on-chain as wasm32v1-none. Host-only dependencies —
# which `soroban-sdk` pulls in behind `cfg(not(target_family = "wasm"))` for
# tests and the host runtime — never ship, so their advisories are not ours to
# fix and must not gate the build. Restricting the graph keeps the check
# meaningful: an advisory that actually reaches the deployed Wasm still fails.
targets = [
  { triple = "wasm32v1-none" },
]

[advisories]
version = 2
yanked = "deny"
ignore = []

[licenses]
version = 2
# Soroban contract dependencies are permissively licensed.
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Zlib",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"
deny = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
